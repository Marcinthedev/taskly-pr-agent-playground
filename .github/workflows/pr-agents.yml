name: PR agents

on:
  pull_request:
    # Add `labeled` to enable the testability agent (an extra, see SOLUTION_EXTENDED.md).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/src/**"
      - "frontend/src/**"

permissions: {}

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name || 'tests' }}
  cancel-in-progress: true

env:
  MODE: ${{ github.event.action == 'labeled' && 'refactor' || 'tests' }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  skip-notice:
    name: Skip (fork or not allowed)
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'testability') &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       !((vars.PR_AGENT_ALLOWED_USERS == '' && github.actor == github.repository_owner) ||
         (vars.PR_AGENT_ALLOWED_USERS != '' && contains(format(',{0},', vars.PR_AGENT_ALLOWED_USERS), format(',{0},', github.actor)))))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "::notice::PR agents skipped: they run only for same-repository branches and for users in PR_AGENT_ALLOWED_USERS (default: the repository owner). Triggered by: $ACTOR"
          echo "PR agents skipped for \`$ACTOR\`: fork PRs and users outside PR_AGENT_ALLOWED_USERS do not run the agents." >> "$GITHUB_STEP_SUMMARY"

  generate:
    name: ${{ github.event.action == 'labeled' && 'Refactor for testability and verify' || 'Plan, write and verify tests' }}
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'testability') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((vars.PR_AGENT_ALLOWED_USERS == '' && github.actor == github.repository_owner) ||
       (vars.PR_AGENT_ALLOWED_USERS != '' && contains(format(',{0},', vars.PR_AGENT_ALLOWED_USERS), format(',{0},', github.actor))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_AGENT_SANDBOX_USER: prsandbox
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out agent tooling from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .trusted-base
          persist-credentials: false
          sparse-checkout: |
            .claude
            .github/pr-agent
            scripts/pr-agent

      - name: Move trusted tooling out of the workspace
        run: |
          set -euo pipefail
          TRUSTED="$RUNNER_TEMP/trusted"
          RESULTS="$RUNNER_TEMP/pr-agent"
          mkdir -p "$RESULTS"
          mv .trusted-base "$TRUSTED"
          if [ ! -f "$TRUSTED/scripts/pr-agent/pr-agent.ts" ]; then
            echo "::error::The base branch has no PR agent. Merge the agent into the base branch first; the PR's own copy is never trusted."
            exit 1
          fi
          echo "TRUSTED=$TRUSTED" >> "$GITHUB_ENV"
          echo "RESULTS=$RESULTS" >> "$GITHUB_ENV"
          echo "CLI=$TRUSTED/scripts/pr-agent/pr-agent.ts" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Load agent settings
        id: config
        env:
          VARS: ${{ toJSON(vars) }}
        run: node "$CLI" config --file "$TRUSTED/.github/pr-agent/pr-agent.env"

      - name: Plan which source files changed
        id: plan
        run: node "$CLI" plan --dir "$RESULTS" --base "origin/$BASE_REF" --head "$HEAD_SHA"

      - name: Pin agent configuration to the base branch
        if: steps.plan.outputs.needs_tests == 'true'
        run: |
          set -euo pipefail
          rm -rf .claude scripts/pr-agent .github/pr-agent
          mkdir -p scripts .github
          cp -R "$TRUSTED/.claude" .
          cp -R "$TRUSTED/scripts/pr-agent" scripts/
          cp -R "$TRUSTED/.github/pr-agent" .github/
          git add -A .claude scripts/pr-agent .github/pr-agent
          if ! git diff --cached --quiet; then
            echo "::notice::This PR changes the agent configuration; the run uses the base-branch version."
            git -c user.name=pr-agent -c user.email=pr-agent@localhost commit -q -m "ci: pin agent configuration"
          fi
          mkdir -p .pr-agent
          cp "$RESULTS/plan.json" "$RESULTS/pr.diff" .pr-agent/

      - name: Create the sandbox user
        if: steps.plan.outputs.needs_tests == 'true'
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /usr/sbin/nologin "$PR_AGENT_SANDBOX_USER"
          dir="$GITHUB_WORKSPACE"
          while [ "$dir" != "/" ]; do sudo chmod o+x "$dir"; dir="$(dirname "$dir")"; done
          sudo find "$HOME" -mindepth 1 -maxdepth 1 ! -name work ! -type l -exec chmod go-rwx {} +
          chmod -R a+rwX backend frontend
          chmod -R go-rwx .git "$RUNNER_TEMP"

      - name: Install dependencies as the sandbox user
        if: steps.plan.outputs.needs_tests == 'true'
        run: |
          set -euo pipefail
          for area in backend frontend; do
            if [ "$(jq -r --arg a "$area" '.areas | index($a) != null' "$RESULTS/plan.json")" = "true" ]; then
              (cd "$area" && sudo -u "$PR_AGENT_SANDBOX_USER" -H env "PATH=$PATH" npm ci --no-audit --no-fund)
            fi
          done

      - name: Cut the sandbox user off the network
        if: steps.plan.outputs.needs_tests == 'true'
        run: |
          set -euo pipefail
          sudo pkill -KILL -u "$PR_AGENT_SANDBOX_USER" || true
          for ipt in iptables ip6tables; do
            sudo "$ipt" -A OUTPUT -o lo -m owner --uid-owner "$PR_AGENT_SANDBOX_USER" -j ACCEPT
            sudo "$ipt" -A OUTPUT -m owner --uid-owner "$PR_AGENT_SANDBOX_USER" -j REJECT
          done
          if sudo -u "$PR_AGENT_SANDBOX_USER" -H env "PATH=$PATH" node -e "fetch('https://api.github.com',{signal:AbortSignal.timeout(5000)}).then(()=>process.exit(1),()=>process.exit(0))"; then
            echo "Sandbox network is blocked."
          else
            echo "::error::The sandbox user can still reach the network." && exit 1
          fi

      - name: Measure baseline coverage
        if: steps.plan.outputs.needs_tests == 'true'
        continue-on-error: true
        run: |
          if [ "${{ steps.plan.outputs.backend }}" = "true" ]; then node "$CLI" verify backend --dir "$RESULTS" --baseline || true; fi
          if [ "${{ steps.plan.outputs.frontend }}" = "true" ]; then node "$CLI" verify frontend --dir "$RESULTS" --baseline || true; fi
          touch "$RUNNER_TEMP/dependencies-marker"

      - name: Choose the agent for this mode
        id: brief
        if: steps.plan.outputs.needs_tests == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$MODE" = "refactor" ]; then
            agent=testability-refactorer
            task="Refactor the hard-to-test logic in the targets of .pr-agent/plan.json into small, pure, tested functions without changing behaviour, verify, and return your JSON report."
            settings=testability-refactorer.settings.json
          else
            agent=test-engineer
            task="Write or update unit tests for the targets in .pr-agent/plan.json, verify them, and return your JSON report."
            settings=test-engineer.settings.json
          fi
          {
            echo "settings=$RUNNER_TEMP/trusted/.github/pr-agent/$settings"
            echo "prompt<<PROMPT_EOF"
            echo "Pull request #$PR_NUMBER changed application source."
            echo "The change plan is in .pr-agent/plan.json and the diff is in .pr-agent/pr.diff."
            echo
            echo "Delegate the work to the \`$agent\` subagent (defined in .claude/agents/$agent.md)"
            echo "with this instruction: \"$task\" Let it finish its own steps; leave all file edits to it."
            echo
            echo "When the subagent returns, end your final message with its fenced \`json\`"
            echo "report block, unchanged. That block is the only output the workflow reads."
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run the agent
        id: agent
        if: steps.plan.outputs.needs_tests == 'true' && env.ENGINE == 'claude-code'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.AGENT_TIMEOUT_MINUTES) }}
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: ${{ steps.brief.outputs.settings }}
          claude_args: >-
            --model ${{ env.MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Skill,Task,Agent,TodoWrite,Bash(node scripts/pr-agent/pr-agent.ts test:*),Bash(node scripts/pr-agent/pr-agent.ts typecheck:*),Bash(node scripts/pr-agent/pr-agent.ts format:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git restore --:*),Bash(git clean -f --:*)"
            --disallowedTools "WebFetch,WebSearch"
          prompt: ${{ steps.brief.outputs.prompt }}

      - name: Run the agent on an OpenAI-compatible model
        id: agent-generic
        if: steps.plan.outputs.needs_tests == 'true' && env.ENGINE == 'openai-compatible' && env.MODE == 'tests'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.AGENT_TIMEOUT_MINUTES) }}
        env:
          PR_AGENT_API_BASE_URL: ${{ env.API_BASE_URL }}
          PR_AGENT_API_KEY: ${{ secrets.PR_AGENT_API_KEY }}
        run: |
          node "$CLI" agent --dir "$RESULTS" --out "$RUNNER_TEMP/agent-execution.json" \
            --agent-file "$TRUSTED/.claude/agents/test-engineer.md" --skills-dir "$TRUSTED/.claude/skills"

      - name: Keep the agent transcript
        if: always() && env.KEEP_TRANSCRIPT == 'true' && (steps.agent.outputs.execution_file || steps.agent-generic.outputs.execution_file)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-agent-transcript
          path: ${{ steps.agent.outputs.execution_file || steps.agent-generic.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Record the agent's decision
        if: steps.plan.outputs.needs_tests == 'true'
        env:
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file || steps.agent-generic.outputs.execution_file }}
        run: node "$CLI" decision --dir "$RESULTS" --execution-file "${EXECUTION_FILE:-none}"

      - name: Guard - only files the mode allows may change
        id: guard
        if: steps.plan.outputs.needs_tests == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/dependencies-marker" ] || { echo "::error::dependency marker missing"; exit 1; }
          changed_deps="$(find backend/node_modules frontend/node_modules \
            \( -path '*/.vite' -o -path '*/.vitest' -o -path '*/.cache' \) -prune -o \
            -type f -newer "$RUNNER_TEMP/dependencies-marker" -print 2>/dev/null | head -n 20)"
          if [ -n "$changed_deps" ]; then
            echo "::error::Files under node_modules changed during the agent run:"; echo "$changed_deps"
            jq -n --arg files "$changed_deps" '{ok:false, allowed:[], violations:[{path:"node_modules", reason:("dependencies were modified: " + ($files|split("\n")|join(", ")))}]}' > "$RESULTS/guard.json"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          node "$CLI" guard --dir "$RESULTS" --policy "$MODE"

      - name: Package the guarded changes as a patch
        id: package
        if: steps.guard.outcome == 'success' && steps.guard.outputs.changed == 'true'
        run: node "$CLI" patch --dir "$RESULTS"

      - name: Verify - typecheck, formatting and full suites with coverage
        id: verify
        if: steps.package.outcome == 'success'
        continue-on-error: true
        run: |
          status=0
          if [ "${{ steps.plan.outputs.backend }}" = "true" ]; then node "$CLI" verify backend --dir "$RESULTS" || status=1; fi
          if [ "${{ steps.plan.outputs.frontend }}" = "true" ]; then node "$CLI" verify frontend --dir "$RESULTS" || status=1; fi
          exit $status

      - name: Confirm verification left the changes untouched
        id: integrity
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        run: |
          node "$CLI" patch --dir "$RESULTS" --out "$RUNNER_TEMP/after-verify.patch"
          cmp "$RESULTS/changes.patch" "$RUNNER_TEMP/after-verify.patch"

      - name: Record the run status
        if: always()
        env:
          CONFIG: ${{ steps.config.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          NEEDS_TESTS: ${{ steps.plan.outputs.needs_tests }}
          AGENT: ${{ env.ENGINE == 'claude-code' && steps.agent.outcome || steps.agent-generic.outcome }}
          GUARD: ${{ steps.guard.outcome }}
          CHANGED: ${{ steps.guard.outputs.changed }}
          VERIFY: ${{ steps.verify.outcome }}
          INTEGRITY: ${{ steps.integrity.outcome }}
        run: |
          mkdir -p "$RESULTS"
          agent_error=""
          if [ -f "$RESULTS/agent-error.txt" ]; then agent_error=": $(head -c 500 "$RESULTS/agent-error.txt" | tr '\n' ' ')"; fi
          if [ "$CONFIG" != "success" ]; then status=failed; reason="the agent settings are invalid; see the Load agent settings step"
          elif [ "$PLAN" != "success" ]; then status=failed; reason="the change plan could not be computed"
          elif [ "$NEEDS_TESTS" != "true" ]; then status=skipped; reason="no unit-testable application source changed"
          elif [ "$GUARD" = "failure" ]; then status=rejected; reason="the agent changed files outside its policy, so its work was discarded"
          elif [ "$CHANGED" != "true" ] && [ "$AGENT" != "success" ]; then status=failed; reason="the agent run did not complete${agent_error}"
          elif [ "$CHANGED" != "true" ] && [ ! -f "$RESULTS/decision.json" ]; then status=failed; reason="the agent made no changes and returned no report; see the agent step log"
          elif [ "$CHANGED" != "true" ]; then status=skipped; reason="the agent decided no changes were needed"
          elif [ "$VERIFY" != "success" ]; then status=rejected; reason="the changes failed typecheck, formatting or the test suite"
          elif [ "$INTEGRITY" != "success" ]; then status=rejected; reason="files changed while the tests ran, so the verified result cannot be trusted"
          else status=verified; reason=""
          fi
          jq -n --arg status "$status" --arg reason "$reason" '{status: $status, reason: $reason}' > "$RESULTS/status.json"
          cat "$RESULTS/status.json"

      - name: Upload agent results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-agent-results
          path: ${{ runner.temp }}/pr-agent
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: ${{ github.event.action == 'labeled' && 'Open refactor PR and report' || 'Commit verified tests and report' }}
    needs: generate
    if: always() && (needs.generate.result == 'success' || needs.generate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download agent results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-agent-results
          path: ${{ runner.temp }}/pr-agent

      - name: Check out report tooling from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/pr-agent
            scripts/pr-agent

      - name: Read run status
        id: status
        run: |
          RESULTS="$RUNNER_TEMP/pr-agent"
          echo "RESULTS=$RESULTS" >> "$GITHUB_ENV"
          echo "CLI=$GITHUB_WORKSPACE/trusted/scripts/pr-agent/pr-agent.ts" >> "$GITHUB_ENV"
          echo "status=$(jq -r .status "$RESULTS/status.json")" >> "$GITHUB_OUTPUT"

      - name: Load agent settings
        env:
          VARS: ${{ toJSON(vars) }}
        run: node "$CLI" config --file "$GITHUB_WORKSPACE/trusted/.github/pr-agent/pr-agent.env"

      - name: Check out the PR branch
        if: steps.status.outputs.status == 'verified' && (env.MODE == 'refactor' || env.AUTO_COMMIT != 'false')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: pr
          persist-credentials: true

      - name: Commit verified tests to the PR branch
        id: commit
        if: env.MODE == 'tests' && steps.status.outputs.status == 'verified' && env.AUTO_COMMIT != 'false'
        working-directory: pr
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "status=rejected" >> "$GITHUB_OUTPUT"
            echo "reason=the branch moved while the agent was running; the next run will regenerate tests" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node "$CLI" check-patch --dir "$RESULTS" --patch "$RESULTS/changes.patch" --policy tests
          git apply --index "$RESULTS/changes.patch"
          usage="$(node "$CLI" usage --dir "$RESULTS")"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "test: add unit tests for changed code [pr-test-agent]" -m "Agent usage: ${usage}"
          git push -q origin "HEAD:refs/heads/$HEAD_REF"
          echo "status=committed" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Testability agent (extra, disabled): opens its verified refactor as a PR into the feature branch.
      # - name: Open the refactor as a PR into the feature branch
      #   id: refactor-pr
      #   if: env.MODE == 'refactor' && steps.status.outputs.status == 'verified'
      #   working-directory: pr
      #   env:
      #     HEAD_REF: ${{ github.event.pull_request.head.ref }}
      #     PR_NUMBER: ${{ github.event.pull_request.number }}
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     set -euo pipefail
      #     if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
      #       echo "status=rejected" >> "$GITHUB_OUTPUT"
      #       echo "reason=the branch moved while the agent was running; add the label again to retry" >> "$GITHUB_OUTPUT"
      #       exit 0
      #     fi
      #     node "$CLI" check-patch --dir "$RESULTS" --patch "$RESULTS/changes.patch" --policy refactor
      #     branch="testability/pr-${PR_NUMBER}"
      #     git checkout -q -b "$branch"
      #     git apply --index "$RESULTS/changes.patch"
      #     usage="$(node "$CLI" usage --dir "$RESULTS")"
      #     git -c user.name="github-actions[bot]" \
      #         -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
      #         commit -q -m "refactor: extract testable logic for #${PR_NUMBER} [testability-agent]" -m "Agent usage: ${usage}"
      #     git push -q --force origin "HEAD:refs/heads/$branch"
      #     existing="$(gh pr list --head "$branch" --base "$HEAD_REF" --state open --json number,url --jq '.[0] // empty')"
      #     if [ -n "$existing" ]; then
      #       url="$(jq -r .url <<< "$existing")"; number="$(jq -r .number <<< "$existing")"
      #     else
      #       url="$(gh pr create --base "$HEAD_REF" --head "$branch" \
      #         --title "Refactor for testability: #${PR_NUMBER}" \
      #         --body "Proposed by the testability agent for #${PR_NUMBER}: logic extracted into small, tested functions. Existing tests are unchanged and pass. Review it like any PR; merge it into \`${HEAD_REF}\` to take it, or close it.")"
      #       number="${url##*/}"
      #     fi
      #     echo "status=pr-opened" >> "$GITHUB_OUTPUT"
      #     echo "url=$url" >> "$GITHUB_OUTPUT"
      #     echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Render report
        id: render
        env:
          RUN_STATUS: ${{ steps.status.outputs.status }}
          COMMIT_STATUS: ${{ steps.commit.outputs.status }}
          COMMIT_REASON: ${{ steps.commit.outputs.reason }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status="$RUN_STATUS"; reason="$(jq -r '.reason // ""' "$RESULTS/status.json")"; sha=""
          if [ "$RUN_STATUS" = "verified" ]; then
            if [ "$MODE" = "tests" ] && [ "$AUTO_COMMIT" = "false" ]; then status=proposed
            elif [ "$COMMIT_OUTCOME" = "failure" ]; then status=rejected; reason="the verified changes could not be published (see the workflow log)"
            else status="$COMMIT_STATUS"; reason="$COMMIT_REASON"; sha="$COMMIT_SHA"
            fi
          fi
          node "$CLI" report --dir "$RESULTS" --mode "$MODE" --run-url "$RUN_URL" --out "$RUNNER_TEMP/comment.md" \
            --status "$status" --reason "$reason" --sha "$sha"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          { echo "reason<<REASON_EOF"; echo "$reason"; echo "REASON_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Post or update the PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
            // One comment per agent: the first line of the body is its marker.
            const marker = body.split('\n', 1)[0];
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      # Testability agent (extra, disabled): removes its label so it can be added again.
      # - name: Remove the testability label so it can be added again
      #   if: always() && env.MODE == 'refactor'
      #   continue-on-error: true
      #   uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      #   with:
      #     script: |
      #       await github.rest.issues.removeLabel({
      #         ...context.repo,
      #         issue_number: context.payload.pull_request.number,
      #         name: 'testability',
      #       });

      - name: Write the audit record
        if: always()
        env:
          STATUS: ${{ steps.render.outputs.status }}
          REASON: ${{ steps.render.outputs.reason }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          node "$CLI" audit --dir "$RESULTS" --out "$RUNNER_TEMP/audit/audit.json" \
            --mode "$MODE" --engine "$ENGINE" --model "$MODEL" --max-turns "$MAX_TURNS" --timeout-minutes "$AGENT_TIMEOUT_MINUTES" \
            --status "${STATUS:-failed}" --reason "$REASON" --sha "$SHA"

      - name: Upload the audit record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-agent-audit
          path: ${{ runner.temp }}/audit/audit.json
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the check when the agent's work was not accepted
        if: steps.render.outputs.status == 'failed' || steps.render.outputs.status == 'rejected'
        env:
          STATUS: ${{ steps.render.outputs.status }}
          REASON: ${{ steps.render.outputs.reason }}
        run: |
          echo "::error::PR agent (${MODE}) ${STATUS}: ${REASON}"
          exit 1
